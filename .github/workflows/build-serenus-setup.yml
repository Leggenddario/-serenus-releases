name: Build Serenus Windows Setup
on:
  push:
    paths:
      - 'installer/**'
      - '.github/workflows/build-serenus-setup.yml'
      - 'installer/test_installed_serenus.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout installer sources
        uses: actions/checkout@v4
      - name: Check public-key and installer files
        shell: pwsh
        run: |
          if (!(Test-Path 'installer/release-public-key.txt')) { throw 'Public release key missing' }
          if ((Get-Content 'installer/release-public-key.txt' -Raw).Trim().Length -lt 40) { throw 'Invalid release public key' }
          if (!(Test-Path 'installer/updater/core.py')) { throw 'Updater missing' }
      - name: Download signed official Python Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile 'installer/python-3.12.10-amd64.exe'
          $sig=Get-AuthenticodeSignature 'installer/python-3.12.10-amd64.exe'
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
            throw "Unexpected Python installer signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
      - name: Install free Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Serenus_Setup.exe
        shell: pwsh
        run: |
          $compiler=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler missing' }
          Push-Location 'installer'
          & $compiler 'serenus_setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          Pop-Location
      - name: Install the EXE on a fresh Windows runner
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'installer/dist/Serenus_Setup.exe').Path
          Write-Host 'Running silent Windows installer...'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/LOG=' + (Join-Path $env:RUNNER_TEMP 'serenus-setup.log')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Serenus_Setup failed with exit code $($process.ExitCode)" }
          Write-Host 'Windows installer exited successfully.'
      - name: Verify bootstrap completed and inspect installed paths
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'Serenus'
          Write-Host ('Expected installation root: ' + $root)
          if (Test-Path $root) {
            Get-ChildItem -LiteralPath $root -Force | Select-Object Name,Mode,Length | Format-Table -AutoSize
            $logDir = Join-Path $root 'install-logs'
            if (Test-Path $logDir) {
              Get-ChildItem -LiteralPath $logDir | Select-Object Name,Length | Format-Table -AutoSize
              $log = Join-Path $logDir 'bootstrap.log'
              if (Test-Path $log) { Get-Content -LiteralPath $log -Tail 80 }
              $pylog = Join-Path $logDir 'python-installer.log'
              if (Test-Path $pylog) { Get-Content -LiteralPath $pylog -Tail 40 }
            }
          }
          $python = Join-Path $root 'python-runtime/python.exe'
          $marker = Join-Path $root 'install-logs/bootstrap-success.txt'
          $state = Join-Path $root 'state/update-state.json'
          if (!(Test-Path $python)) { throw "Missing installed Python: $python" }
          if (!(Test-Path $marker)) { throw "Bootstrap did not complete: $marker" }
          if (!(Test-Path $state)) { throw "Missing activated Serenus state: $state" }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Python cannot execute' }
      - name: Smoke-test installed app and rollback logic
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Serenus/python-runtime/python.exe'
          if (!(Test-Path $python)) { throw "Python runtime missing: $python" }
          & $python 'installer/test_installed_serenus.py'
          if ($LASTEXITCODE -ne 0) { throw "Installed Serenus smoke test failed: $LASTEXITCODE" }
      - name: Preserve installation logs (even on failure)
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Serenus'
          $dir = Join-Path $root 'install-logs'
          $files = @{
            'bootstrap.log' = 'serenus-bootstrap.log'
            'python-installer.log' = 'serenus-python-installer.log'
          }
          foreach ($name in $files.Keys) {
            $src = Join-Path $dir $name
            if (Test-Path $src) { Copy-Item $src (Join-Path $env:RUNNER_TEMP $files[$name]) -Force }
          }
      - name: Upload installation diagnostics (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Serenus-Windows-Install-Diagnostics
          path: |
            ${{ runner.temp }}/serenus-setup.log
            ${{ runner.temp }}/serenus-bootstrap.log
            ${{ runner.temp }}/serenus-python-installer.log
          if-no-files-found: warn
      - name: Upload setup to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Serenus-Setup-Windows
          path: installer/dist/Serenus_Setup.exe
          if-no-files-found: error
      - name: Attach installer to existing Serenus 1.6 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.6.0 --repo Leggenddario/-serenus-releases *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Release v1.6.0 missing; no installer uploaded' }
          gh release upload v1.6.0 installer/dist/Serenus_Setup.exe --repo Leggenddario/-serenus-releases --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Setup release upload failed' }
